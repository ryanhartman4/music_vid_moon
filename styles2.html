<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Take Me (To the Moon) studio</title>
<style>
  @font-face { font-family: "Permanent Marker"; src: url(fonts/permanent-marker-latin-400-normal.woff2); font-display: block; }
  @font-face { font-family: "Anton"; src: url(fonts/anton-latin-400-normal.woff2); font-display: block; }
  @font-face { font-family: "Orbitron"; src: url(fonts/orbitron-latin-800-normal.woff2); font-display: block; }
  @font-face { font-family: "Caveat"; src: url(fonts/caveat-latin-700-normal.woff2); font-display: block; }
  @font-face { font-family: "Shantell Sans"; src: url(fonts/shantell-sans-latin-800-normal.woff2); font-display: block; }
  @font-face { font-family: "Rajdhani"; src: url(fonts/rajdhani-latin-700-normal.woff2); font-display: block; }
  html, body { margin: 0; background: #14101c; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; background: #000; }
  #scene { display: none; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <canvas id="scene" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="158.8" step="0.0333" value="0"><span id="tt">loading…</span></div>
</main>
<script src="src/song.js"></script>
<script src="src/core.js"></script>
<script src="src/fx.js"></script>
<script src="src/timeline.js"></script>
<script src="src/hero.js"></script>
<script src="src/model.js"></script>
<script src="src/world.js"></script>
<script src="src/styles/flatcartoon.js"></script>
<script src="src/styles/actionanime.js"></script>
<script src="src/styles/cozyanime.js"></script>
<script src="src/styles/geometric.js"></script>
<script src="src/styles/rubberhose.js"></script>
<script src="src/styles/ligneclaire.js"></script>
<script src="src/styles/chibi.js"></script>
<script src="src/styles/papercut.js"></script>
<script src="src/styles/baseline.js"></script>
</body>
</html>
